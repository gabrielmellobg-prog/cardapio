<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drinks Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --gold:#F5DA4B;--bg:#0a0a0a;--panel:#111;--border:rgba(245,218,75,0.18);
  --gold-dim:rgba(245,218,75,0.10);--gold-mid:rgba(245,218,75,0.30);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Rajdhani',sans-serif;color:#fff;}
 
/* scanlines */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:9998;}
 
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s,transform .35s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(0.97);}
 
/* ══════════════════════════
   BOOT
══════════════════════════ */
#boot{background:var(--bg);z-index:10;}
 
.boot-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,218,75,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(245,218,75,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
.boot-corner{position:absolute;width:32px;height:32px;border-color:var(--gold);border-style:solid;opacity:.5;}
.boot-corner.tl{top:20px;left:20px;border-width:2px 0 0 2px;}
.boot-corner.tr{top:20px;right:20px;border-width:2px 2px 0 0;}
.boot-corner.bl{bottom:20px;left:20px;border-width:0 0 2px 2px;}
.boot-corner.br{bottom:20px;right:20px;border-width:0 2px 2px 0;}
 
.boot-inner{text-align:center;position:relative;z-index:1;padding:0 32px;}
.boot-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,22vw,8rem);
  letter-spacing:10px;
  background:linear-gradient(160deg,#fff 30%,var(--gold) 70%,#c9a800);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:flicker 4s infinite;
  line-height:1;
}
@keyframes flicker{0%,92%,94%,100%{opacity:1;}93%{opacity:.3;}}
.boot-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(245,218,75,.45);letter-spacing:5px;margin-top:10px;text-transform:uppercase;}
.boot-press{
  margin-top:56px;
  font-family:'Share Tech Mono',monospace;font-size:13px;
  color:var(--gold);letter-spacing:3px;
  animation:blink 1.3s step-end infinite;
  cursor:pointer;padding:16px 32px;
  border:1px solid rgba(245,218,75,.25);
  border-radius:2px;
  background:rgba(245,218,75,.04);
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
 
/* ══════════════════════════
   SELECT
══════════════════════════ */
#select{
  background:var(--bg);
  z-index:9;
  overflow-y:auto;
  justify-content:flex-start;
  padding:0;
}
 
.select-top{
  position:sticky;top:0;z-index:20;
  width:100%;
  padding:20px 20px 14px;
  background:linear-gradient(to bottom,var(--bg) 80%,transparent);
  text-align:center;
  flex-shrink:0;
}
.select-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,8vw,3rem);
  letter-spacing:6px;
  background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.4));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.select-sub{font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(245,218,75,.4);letter-spacing:3px;margin-top:4px;}
 
.drinks-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:2px;
  width:100%;
  padding:0 2px 40px;
}
 
.drink-slot{
  position:relative;
  border:1px solid rgba(245,218,75,.08);
  padding:18px 14px 22px;
  cursor:pointer;
  overflow:hidden;
  transition:all .2s;
  background:rgba(255,255,255,.012);
  min-height:90px;
  display:flex;flex-direction:column;
  justify-content:space-between;
  -webkit-tap-highlight-color:transparent;
}
.drink-slot:active{background:rgba(245,218,75,.1);border-color:rgba(245,218,75,.5);}
.drink-slot::after{
  content:'→';
  position:absolute;right:10px;bottom:10px;
  font-family:'Share Tech Mono',monospace;
  font-size:14px;color:rgba(245,218,75,.2);
  transition:all .2s;
}
.drink-slot:active::after{color:var(--gold);}
 
.slot-num{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(245,218,75,.28);letter-spacing:2px;margin-bottom:8px;}
.slot-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(1rem,4.5vw,1.4rem);letter-spacing:2px;color:#fff;line-height:1.1;}
.slot-type{font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.22);text-transform:uppercase;margin-top:5px;}
.slot-prep{font-size:8px;color:rgba(245,218,75,.28);letter-spacing:1px;margin-top:2px;font-family:'Share Tech Mono',monospace;}
 
.drink-slot.flash{animation:slotFlash .35s ease;}
@keyframes slotFlash{0%{background:rgba(245,218,75,.22);}100%{background:transparent;}}
 
/* ══════════════════════════
   DRINK SCREEN — MOBILE VERTICAL
══════════════════════════ */
#drink-screen{
  background:var(--bg);
  z-index:8;
  overflow:hidden;
  justify-content:flex-start;
}
 
/* Top bar */
.drink-topbar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px 10px;
  flex-shrink:0;
  border-bottom:1px solid rgba(245,218,75,.08);
  background:var(--bg);
  position:relative;
  z-index:10;
}
.back-btn{
  display:flex;align-items:center;gap:6px;
  font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;
  color:rgba(245,218,75,.55);cursor:pointer;border:none;background:none;padding:6px 0;
  transition:color .2s;
}
.back-btn:active{color:var(--gold);}
.topbar-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.1rem,5vw,1.5rem);
  letter-spacing:3px;color:#fff;
  text-align:center;flex:1;padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-serve{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:rgba(245,218,75,.45);
  letter-spacing:1px;text-align:right;
  min-width:70px;
  text-transform:uppercase;
  white-space:nowrap;
}
 
/* Progress bar */
.progress-wrap{width:100%;height:2px;background:rgba(255,255,255,.05);flex-shrink:0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#c9a800);width:0%;transition:width .5s ease;}
 
/* Prep label */
.prep-label{
  width:100%;
  padding:7px 16px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;
  color:rgba(245,218,75,.5);
  letter-spacing:2px;
  background:rgba(245,218,75,.03);
  border-bottom:1px solid rgba(245,218,75,.06);
  flex-shrink:0;
}
 
/* Glass area */
.glass-area{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  width:100%;
  /* height set by JS based on screen */
}
 
.stage-glow{
  position:absolute;
  width:260px;height:260px;border-radius:50%;
  bottom:-80px;left:50%;transform:translateX(-50%);
  filter:blur(55px);opacity:.45;
  transition:background 1.2s ease;
  pointer-events:none;
}
 
.glass-container{position:relative;flex-shrink:0;}
.glass-canvas{display:block;}
.glass-svg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:15;pointer-events:none;}
.pour-stream{position:absolute;top:0;left:50%;transform:translateX(-50%);width:10px;border-radius:6px;z-index:20;pointer-events:none;opacity:0;}
.pour-stream.active{animation:pourAnim .9s cubic-bezier(.4,0,.6,1) forwards;}
@keyframes pourAnim{0%{opacity:0;height:0;top:-20px;}10%{opacity:1;}60%{opacity:1;height:120px;}85%{opacity:.6;height:70px;}100%{opacity:0;height:0;}}
 
.splash-drop{position:absolute;border-radius:50%;pointer-events:none;z-index:25;animation:dropOut .5s ease-out forwards;}
@keyframes dropOut{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}}
 
/* Done overlay on glass */
.done-overlay{
  display:none;
  position:absolute;inset:0;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;
  z-index:30;background:rgba(10,10,10,.55);
}
.done-overlay.show{display:flex;}
.done-text{
  font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:5px;
  color:var(--gold);text-shadow:0 0 24px rgba(245,218,75,.6);
  animation:popIn .4s cubic-bezier(.17,.67,.3,1.4) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
.replay-btn{
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;
  color:rgba(245,218,75,.65);background:rgba(10,10,10,.8);
  border:1px solid rgba(245,218,75,.25);border-radius:3px;
  padding:8px 20px;cursor:pointer;transition:all .2s;
}
.replay-btn:active{color:var(--gold);border-color:var(--gold);}
 
/* Ingredient buttons */
.ing-scroll{
  flex:1;
  overflow-y:auto;
  width:100%;
  padding:10px 12px 20px;
  display:flex;flex-direction:column;gap:7px;
  -webkit-overflow-scrolling:touch;
}
 
/* Ingredient area header with toggle */
.ing-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 4px;
  flex-shrink:0;
  width:100%;
}
.ing-header-label{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(245,218,75,.35);letter-spacing:3px;text-transform:uppercase;
}
.toggle-mode-btn{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;
  color:rgba(245,218,75,.6);
  background:rgba(245,218,75,.06);
  border:1px solid rgba(245,218,75,.2);
  border-radius:20px;padding:5px 12px;
  cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.toggle-mode-btn:active{background:rgba(245,218,75,.18);color:var(--gold);}
 
/* ── LIST MODE ── */
.ing-scroll{
  flex:1;overflow-y:auto;width:100%;
  padding:6px 12px 20px;
  display:flex;flex-direction:column;gap:7px;
  -webkit-overflow-scrolling:touch;
}
.ing-btn{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:11px 14px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(245,218,75,.12);
  border-radius:8px;
  cursor:pointer;transition:all .18s;
  font-family:'Rajdhani',sans-serif;color:#fff;
  position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  flex-shrink:0;
}
.ing-btn:active:not(.done):not(.pouring){border-color:rgba(245,218,75,.5);background:rgba(245,218,75,.08);}
.ing-btn.done{border-color:rgba(245,218,75,.3);background:rgba(245,218,75,.03);opacity:.5;cursor:default;}
.ing-btn.done::after{content:'✓';position:absolute;right:12px;color:var(--gold);font-size:15px;font-weight:700;}
.ing-btn.pouring{border-color:var(--gold);background:rgba(245,218,75,.1);pointer-events:none;}
.ing-btn.shake{animation:shake .28s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.ing-emoji{font-size:22px;flex-shrink:0;width:28px;text-align:center;}
.ing-body{flex:1;min-width:0;}
.ing-name{font-size:13px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ing-qty{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--gold);margin-top:1px;}
 
/* ── FLASHCARD MODE ── */
.card-grid{
  flex:1;overflow-y:auto;width:100%;
  padding:6px 12px 24px;
  display:flex;
  flex-direction:column;
  gap:7px;
  -webkit-overflow-scrolling:touch;
}
 
/* 3D flip container — same strip size as ing-btn */
.fc-wrap{
  perspective:600px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  width:100%;
  height:48px;
  flex-shrink:0;
}
.fc-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
  border-radius:8px;
}
.fc-wrap.flipped .fc-inner{transform:rotateY(180deg);}
 
.fc-face{
  position:absolute;inset:0;
  border-radius:8px;
  display:flex;align-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
  padding:0 14px;
}
 
/* BACK face — hidden side (the "?" card) */
.fc-back{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(245,218,75,.14);
  transform:rotateY(0deg);
  justify-content:space-between;
  gap:10px;
}
.fc-back-num{
  font-family:'Share Tech Mono',monospace;font-size:10px;
  color:rgba(245,218,75,.32);letter-spacing:2px;flex-shrink:0;
}
.fc-back-q{
  font-size:18px;flex-shrink:0;
  filter:drop-shadow(0 0 8px rgba(245,218,75,.3));
  animation:qPulse 2s ease-in-out infinite;
}
@keyframes qPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.fc-back-hint{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(245,218,75,.28);letter-spacing:1px;flex:1;text-align:right;
}
 
/* golden shimmer on back */
.fc-back::before{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(135deg,rgba(245,218,75,.06) 0%,transparent 50%,rgba(245,218,75,.03) 100%);
  pointer-events:none;
}
 
/* FRONT face — revealed ingredient */
.fc-front{
  background:rgba(245,218,75,.06);
  border:1px solid rgba(245,218,75,.35);
  transform:rotateY(180deg);
  gap:12px;
  box-shadow:0 0 14px rgba(245,218,75,.08);
}
.fc-emoji{font-size:22px;flex-shrink:0;width:28px;text-align:center;filter:drop-shadow(0 2px 6px rgba(245,218,75,.3));}
.fc-name{flex:1;min-width:0;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-qty{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--gold);font-weight:600;flex-shrink:0;}
 
/* done state on flashcard */
.fc-wrap.poured .fc-front{
  background:rgba(245,218,75,.03);
  border-color:rgba(245,218,75,.2);
  opacity:.55;
}
.fc-wrap.poured .fc-front::after{
  content:'✓';position:absolute;top:50%;right:10px;transform:translateY(-50%);
  color:var(--gold);font-size:14px;font-weight:700;
}
 
/* Flash */
#flash{position:fixed;inset:0;background:#F5DA4B;z-index:9999;opacity:0;pointer-events:none;transition:opacity .1s;}
</style>
</head>
<body>
<div id="flash"></div>
 
<!-- ══ BOOT ══ -->
<div class="screen" id="boot">
  <div class="boot-grid"></div>
  <div class="boot-corner tl"></div><div class="boot-corner tr"></div>
  <div class="boot-corner bl"></div><div class="boot-corner br"></div>
  <div class="boot-inner">
    <div class="boot-logo">DRINKS</div>
    <div class="boot-sub">Menu Interativo</div>
    <div class="boot-press" onclick="goToSelect()">▶ &nbsp;TOQUE PARA INICIAR</div>
  </div>
</div>
 
<!-- ══ SELECT ══ -->
<div class="screen hidden" id="select">
  <div class="select-top">
    <div class="select-title">ESCOLHA SEU DRINK</div>
    <div class="select-sub">// toque para ver o preparo</div>
  </div>
  <div class="drinks-grid" id="drinks-grid"></div>
</div>
 
<!-- ══ DRINK SCREEN ══ -->
<div class="screen hidden" id="drink-screen">
 
  <!-- top bar -->
  <div class="drink-topbar">
    <button class="back-btn" onclick="goBack()">← VOLTAR</button>
    <div class="topbar-title" id="d-title"></div>
    <div class="topbar-serve" id="d-serve"></div>
  </div>
 
  <!-- progress -->
  <div class="progress-wrap"><div class="progress-fill" id="d-progress"></div></div>
 
  <!-- prep label -->
  <div class="prep-label" id="d-prep"></div>
 
  <!-- glass -->
  <div class="glass-area" id="glass-area">
    <div class="stage-glow" id="stage-glow"></div>
    <div class="glass-container" id="glass-container">
      <canvas id="glass-canvas"></canvas>
      <div class="pour-stream" id="pour-stream"></div>
      <svg class="glass-svg-overlay" id="glass-svg" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="done-overlay" id="done-overlay">
      <div class="done-text">🍹 PRONTO!</div>
      <button class="replay-btn" onclick="resetDrink()">↺ RECOMEÇAR</button>
    </div>
  </div>
 
  <!-- ingredient area -->
  <div class="ing-header">
    <span class="ing-header-label">Ingredientes</span>
    <button class="toggle-mode-btn" id="toggle-mode-btn" onclick="toggleMode()">🃏 ESCONDER</button>
  </div>
  <div class="ing-scroll" id="ing-scroll"></div>
  <div class="card-grid" id="card-grid" style="display:none;"></div>
 
</div>
 
<script>

// DATA
// ─────────────────────────────────────────
const DRINKS = [

  {name:"Bramble",serve:"On the Rock",glass:"rock",prep:"Acrescente ao copo",finalColor:"rgba(80,30,160,0.8)",
   ings:[{e:"🍸",n:"Gin",q:"50 ml",r:192,g:234,b:248},{e:"🍋",n:"Limão Taiti",q:"25 ml",r:176,g:216,b:32},{e:"🍬",n:"Xarope simples",q:"20 ml",r:240,g:232,b:128},{e:"🧊",n:"Misture bem com gelo",q:"a gosto",r:180,g:230,b:248},{e:"🫐",n:"Calda de Jabuticaba — forma circular",q:"a gosto",r:80,g:32,b:160},{e:"🍋",n:"Limão desidratado",q:"decoração",r:240,g:200,b:80}]},
  {name:"Beleza Americana",serve:"On the Rock",glass:"rock",prep:"Acrescente ao copo",finalColor:"rgba(220,80,140,0.78)",

// ─────────────────────────────────────────
// GLASS DRAWING
// ─────────────────────────────────────────
function glassShape(type){
  if(type==='rock')    return {tx1:16,tx2:144,bx1:24,bx2:136,ty:28,by:196,bh:8};
  if(type==='gin')     return {tx1:8,tx2:152,bx1:58,bx2:102,ty:16,by:194,bh:10};
  if(type==='mug')     return {tx1:18,tx2:142,bx1:22,bx2:138,ty:24,by:194,bh:10};
  /* longdrink */      return {tx1:20,tx2:140,bx1:28,bx2:132,ty:16,by:196,bh:8};
}
 
function drawGlass(canvas, type, layers, iceCount){
  const W=canvas.width, H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const g=glassShape(type);
 
  function xAtY(y){
    const t=(y-g.ty)/(g.by-g.ty);
    return{lx:g.tx1+(g.bx1-g.tx1)*t, rx:g.tx2+(g.bx2-g.tx2)*t};
  }
 
  // clip to glass interior
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g.tx1,g.ty);ctx.lineTo(g.tx2,g.ty);
  ctx.lineTo(g.bx2,g.by);ctx.lineTo(g.bx2,g.by+g.bh);
  ctx.lineTo(g.bx1,g.by+g.bh);ctx.lineTo(g.bx1,g.by);
  ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(20,20,10,0.5)';ctx.fillRect(0,0,W,H);
 
  // liquid layers
  const usableH=g.by-g.ty-6;
  let bottom=g.by-4;
  layers.forEach(l=>{
    const lH=Math.min(l.pct*usableH,usableH);
    const top=Math.max(bottom-lH,g.ty+2);
    const {lx:lb,rx:rb}=xAtY(bottom);
    const {lx:lt,rx:rt}=xAtY(top);
    const grad=ctx.createLinearGradient(0,top,0,bottom);
    grad.addColorStop(0,`rgba(${l.r},${l.g},${l.b},${l.a*.65})`);
    grad.addColorStop(1,`rgba(${l.r},${l.g},${l.b},${l.a})`);
    ctx.beginPath();ctx.moveTo(lb,bottom);ctx.lineTo(rb,bottom);ctx.lineTo(rt,top);ctx.lineTo(lt,top);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.moveTo(lt+3,top+2);ctx.lineTo(rt-3,top+2);
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1.5;ctx.stroke();
    bottom=top;
  });
  ctx.restore();
 
  // ice
  if(iceCount>0){
    const icePos=[{x:44,y:165,r:-12},{x:78,y:172,r:8},{x:62,y:152,r:-4},{x:96,y:160,r:14},{x:50,y:142,r:18}];
    for(let i=0;i<Math.min(iceCount,icePos.length);i++){
      const p=icePos[i];
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);
      const ig=ctx.createLinearGradient(-12,-8,12,8);
      ig.addColorStop(0,'rgba(210,240,255,0.88)');ig.addColorStop(.5,'rgba(170,215,240,0.6)');ig.addColorStop(1,'rgba(200,235,255,0.42)');
      ctx.fillStyle=ig;ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(-12,-8,24,16,3);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.roundRect(-8,-5,8,3,2);ctx.fill();
      ctx.restore();
    }
  }
 
  // glass outline
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g.tx1,g.ty);ctx.lineTo(g.bx1,g.by);ctx.lineTo(g.bx1,g.by+g.bh);ctx.lineTo(g.bx2,g.by+g.bh);ctx.lineTo(g.bx2,g.by);ctx.lineTo(g.tx2,g.ty);
  const og=ctx.createLinearGradient(0,g.ty,W,g.by);
  og.addColorStop(0,'rgba(255,255,255,0.5)');og.addColorStop(.5,'rgba(255,255,255,0.15)');og.addColorStop(1,'rgba(255,255,255,0.4)');
  ctx.strokeStyle=og;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(g.tx1+7,g.ty+8);ctx.lineTo(g.bx1+9,g.by-8);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
 
  // mug handle
  if(type==='mug'){
    ctx.save();
    ctx.beginPath();ctx.arc(g.bx2+16,(g.ty+g.by)/2,22,-Math.PI*.5,Math.PI*.5);
    ctx.strokeStyle='rgba(180,100,30,0.65)';ctx.lineWidth=7;ctx.stroke();
    ctx.strokeStyle='rgba(220,150,60,0.35)';ctx.lineWidth=2.5;ctx.stroke();
    ctx.restore();
  }
}
 
function redrawGlass(ice){
  const canvas=document.getElementById('glass-canvas');
  drawGlass(canvas,currentDrink.glass,liquidLayers,ice?4:0);
}

function openDrink(i){
  const slot=document.querySelectorAll('.drink-slot')[i];
  slot.classList.add('flash');setTimeout(()=>slot.classList.remove('flash'),350);
  currentDrink=DRINKS[i];currentIdx=i;doneCount=0;isPouring=false;liquidLayers=[];
  buildDrinkScreen();
  flashGo(()=>showScreen('drink-screen'));
}
 
function buildDrinkScreen(){
  const d=currentDrink;
 
  // reset card mode
  cardMode=false;
  document.getElementById('ing-scroll').style.display='flex';
  document.getElementById('card-grid').style.display='none';
  document.getElementById('card-grid').innerHTML='';
  document.getElementById('toggle-mode-btn').textContent='🃏 ESCONDER';
 
  // topbar
  document.getElementById('d-title').textContent=d.name;
  document.getElementById('d-serve').textContent=d.serve;
  document.getElementById('d-prep').textContent='▸ '+d.prep;
  document.getElementById('d-progress').style.width='0%';
  document.getElementById('done-overlay').classList.remove('show');
  document.getElementById('stage-glow').style.background='rgba(245,218,75,0.12)';
 
  // size glass responsively
  const vw=window.innerWidth;
  const GW=Math.min(Math.round(vw*0.44),160);
  const GH=Math.round(GW*1.56);
  const canvas=document.getElementById('glass-canvas');
  canvas.width=GW; canvas.height=GH;
  canvas.style.width=GW+'px'; canvas.style.height=GH+'px';
  document.getElementById('glass-container').style.width=GW+'px';
  document.getElementById('glass-container').style.height=GH+'px';
  document.getElementById('glass-svg').setAttribute('viewBox',`0 0 ${GW} ${GH}`);
  document.getElementById('glass-svg').innerHTML=`<text x="${GW/2}" y="${GH-4}" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="8" fill="rgba(245,218,75,0.3)" letter-spacing="1">${({rock:'On the Rock',gin:'Taça de Gin',mug:'Caneca',longdrink:'Long Drink'})[d.glass]||''}</text>`;
 
  // set glass area height
  const topbarH=document.querySelector('.drink-topbar').offsetHeight;
  const progressH=2, prepH=document.querySelector('.prep-label').offsetHeight||30;
  const areaH=Math.round(window.innerHeight*0.38);
  document.getElementById('glass-area').style.height=areaH+'px';
 
  redrawGlass(true);
 
  // ingredient buttons
  document.getElementById('ing-scroll').innerHTML=d.ings.map((ing,j)=>`
    <button class="ing-btn" id="ib-${j}" onclick="pour(${j})">
      <span class="ing-emoji">${ing.e}</span>
      <div class="ing-body">
        <div class="ing-name">${ing.n}</div>
        <div class="ing-qty">${ing.q}</div>
      </div>
    </button>`).join('');
}
 
// ─────────────────────────────────────────
// POUR
// ─────────────────────────────────────────
function pour(idx){
  const d=currentDrink;
  if(isPouring) return;
  if(idx!==doneCount){
    const btn=document.getElementById(`ib-${idx}`);
    btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
    return;
  }
  isPouring=true;
  const ing=d.ings[idx];
  document.getElementById(`ib-${idx}`).classList.add('pouring');
 
  const stream=document.getElementById('pour-stream');
  stream.style.background=`linear-gradient(to bottom,rgba(${ing.r},${ing.g},${ing.b},.9),rgba(${ing.r},${ing.g},${ing.b},.45))`;
  stream.style.boxShadow=`0 0 8px rgba(${ing.r},${ing.g},${ing.b},.5)`;
  stream.classList.remove('active');void stream.offsetWidth;stream.classList.add('active');
 
  setTimeout(()=>{
    const pct=0.74/d.ings.length;
    liquidLayers.push({r:ing.r,g:ing.g,b:ing.b,a:.84,pct});
    redrawGlass(true);
    splash(ing);
    document.getElementById('stage-glow').style.background=`radial-gradient(circle,rgba(${ing.r},${ing.g},${ing.b},.32) 0%,transparent 70%)`;
  },440);
 
  setTimeout(()=>{
    stream.classList.remove('active');
    document.getElementById(`ib-${idx}`).classList.remove('pouring');
    document.getElementById(`ib-${idx}`).classList.add('done');
    doneCount++;
    document.getElementById('d-progress').style.width=(doneCount/d.ings.length*100)+'%';
    isPouring=false;
    syncCardState();
    if(doneCount===d.ings.length) onDone();
  },1050);
}
 
function splash(ing){
  const stage=document.getElementById('glass-area');
  const gc=document.getElementById('glass-container');
  const gr=gc.getBoundingClientRect();
  const sr=stage.getBoundingClientRect();
  const cx=gr.left+gr.width/2-sr.left;
  const cy=gr.top+60-sr.top;
  for(let i=0;i<12;i++){
    const el=document.createElement('div');
    el.className='splash-drop';
    const a=(i/12)*Math.PI*2;
    const dist=18+Math.random()*28;
    el.style.setProperty('--tx',Math.cos(a)*dist+'px');
    el.style.setProperty('--ty',(Math.sin(a)*dist-12)+'px');
    el.style.width=el.style.height=(3+Math.random()*5)+'px';
    el.style.background=`rgba(${ing.r},${ing.g},${ing.b},.8)`;
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.animationDuration=(0.3+Math.random()*0.25)+'s';
    stage.appendChild(el);
    setTimeout(()=>el.remove(),600);
  }
}
 
function onDone(){
  document.getElementById('done-overlay').classList.add('show');
  // keep bubbles
  for(let i=0;i<4;i++) setTimeout(()=>{
    const layers=liquidLayers;if(!layers.length)return;
    const l=layers[layers.length-1];
    document.getElementById('stage-glow').style.background=`radial-gradient(circle,rgba(${l.r},${l.g},${l.b},.4) 0%,transparent 70%)`;
  },i*400);
}
 
function toggleMode(){
  cardMode=!cardMode;
  const btn=document.getElementById('toggle-mode-btn');
  const list=document.getElementById('ing-scroll');
  const grid=document.getElementById('card-grid');
  if(cardMode){
    list.style.display='none';
    grid.style.display='grid';
    btn.textContent='📋 MOSTRAR';
    buildCards();
  } else {
    grid.style.display='none';
    list.style.display='flex';
    btn.textContent='🃏 ESCONDER';
  }
}
 
function buildCards(){
  const d=currentDrink;
  const grid=document.getElementById('card-grid');
  grid.innerHTML=d.ings.map((ing,j)=>{
    const isDone=j<doneCount;
    return `
    <div class="fc-wrap${isDone?' flipped poured':''}" id="fc-${j}" onclick="flipCard(${j})">
      <div class="fc-inner">
        <div class="fc-face fc-back">
          <div class="fc-back-num">${String(j+1).padStart(2,'0')}</div>
          <div class="fc-back-q">🃏</div>
          <div class="fc-back-hint">toque para ver</div>
        </div>
        <div class="fc-face fc-front">
          <div class="fc-emoji">${ing.e}</div>
          <div class="fc-name">${ing.n}</div>
          <div class="fc-qty">${ing.q}</div>
        </div>
      </div>
    </div>`;
  }).join('');
 
  // set card height based on width
  requestAnimationFrame(()=>{
    const cards=grid.querySelectorAll('.fc-wrap');
    if(!cards.length) return;
    const w=cards[0].offsetWidth;
    cards.forEach(c=>{c.style.height=Math.round(w*1.1)+'px';});
  });
}
 
function flipCard(idx){
  const d=currentDrink;
  // In card mode, tapping also triggers the pour if it's the next in order
  const wrap=document.getElementById(`fc-${idx}`);
  if(!wrap) return;
 
  const alreadyFlipped=wrap.classList.contains('flipped');
 
  // flip visual regardless
  wrap.classList.toggle('flipped');
 
  // if flipping face-up (revealing) AND it's the next ingredient → trigger pour
  if(!alreadyFlipped && idx===doneCount && !isPouring){
    pour(idx);
  }
}
 
function syncCardState(){
  // after a pour completes, sync card grid if visible
  const d=currentDrink;
  if(!cardMode) return;
  d.ings.forEach((_,j)=>{
    const wrap=document.getElementById(`fc-${j}`);
    if(!wrap) return;
    if(j<doneCount){
      wrap.classList.add('flipped','poured');
    }
  });
}
 
 
 
function resetDrink(){
  liquidLayers=[];doneCount=0;isPouring=false;cardMode=false;
  buildDrinkScreen();
}
 
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!document.getElementById('drink-screen').classList.contains('hidden')) goBack();
  if((e.key===' '||e.key==='Enter')&&!document.getElementById('boot').classList.contains('hidden')) goToSelect();
});
</script>
